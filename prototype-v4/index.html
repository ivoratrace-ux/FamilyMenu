<title>Семейное меню v4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: one-handed phone app column (max 480px), sticky bottom tab bar, bottom sheets for recipe and replacement */
:root{
  --bg:#f4f5f1; --card:#ffffff; --fg:#1b201c; --muted:#646c66; --line:#dfe3dc;
  --accent:#2c6a4c; --accent-fg:#ffffff; --accent-soft:#e2eee6;
  --saffron:#c98a10; --saffron-soft:#faf0d9; --danger:#b03a2e; --danger-soft:#f8e3df;
  --scrim:rgba(20,24,21,.45); --shadow:0 6px 24px rgba(20,30,24,.12);
  --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --dish:"Literata",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121513; --card:#1b1f1c; --fg:#e8ece8; --muted:#a0a9a2; --line:#2f3631;
  --accent:#78c09a; --accent-fg:#0f1a14; --accent-soft:#1e3328;
  --saffron:#e8b347; --saffron-soft:#352a12; --danger:#ef8a7d; --danger-soft:#3b211e;
  --scrim:rgba(0,0,0,.6); --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513; --card:#1b1f1c; --fg:#e8ece8; --muted:#a0a9a2; --line:#2f3631;
  --accent:#78c09a; --accent-fg:#0f1a14; --accent-soft:#1e3328;
  --saffron:#e8b347; --saffron-soft:#352a12; --danger:#ef8a7d; --danger-soft:#3b211e;
  --scrim:rgba(0,0,0,.6); --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.screen{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dish{font-family:var(--dish);font-weight:600;letter-spacing:-.005em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.secondary{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-weight:600;padding:0 10px;font-size:14px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.danger[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--saffron-soft);color:var(--saffron)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.grey{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.stepper button{border:0;background:transparent;width:38px;height:36px;font-size:18px;color:var(--accent)}
.stepper span{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.progress.over>i{background:var(--danger)}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:transparent;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--saffron);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;line-height:16px}
/* day cards */
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.day header b{font-weight:600}
.day.today header{background:var(--accent-soft)}
.slot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .meal{width:62px;flex:none;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.slot .open{border:0;background:transparent;text-align:left;padding:0;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.slot .open .dish{font-size:16px}
.slot.cooked{background:var(--accent-soft)}
.slot.cooked .meal{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted)}
/* hero today */
.hero{background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.hero .dish{font-size:24px;line-height:1.2}
.hero .meta{color:inherit;opacity:.85}
.hero .btn{background:var(--accent-fg);color:var(--accent)}
/* shopping */
.cat{display:flex;flex-direction:column}
.cat h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 2px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-top:0}
.item:first-of-type{border-top:1px solid var(--line);border-radius:12px 12px 0 0}
.item:last-child{border-radius:0 0 12px 12px}
.item:only-of-type{border-radius:12px}
.item .chk{appearance:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--card)}
.item .chk:checked{background:var(--accent);border-color:var(--accent)}
.item .chk:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.qty{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.for{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.ingr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ingr:last-child{border-bottom:0}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.steps li.done{opacity:.55}
.steps li.done::before{content:"✓";background:var(--accent);color:var(--accent-fg)}
.alt{display:flex;flex-direction:column;gap:8px}
.diff{font-size:13px;display:flex;flex-direction:column;gap:3px;background:var(--bg);border-radius:10px;padding:10px}
.diff .plus{color:var(--accent)}
.diff .minus{color:var(--danger)}
.note{background:var(--saffron-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px}
.note b{color:var(--saffron)}
/* toast + push banner */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.push{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);z-index:70;padding:12px 14px;display:flex;gap:12px;animation:drop .35s ease-out}
@keyframes drop{from{transform:translate(-50%,-120%)}to{transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.push{animation:none}.switch,.switch::after{transition:none}}
.appicon{width:38px;height:38px;border-radius:10px;background:var(--accent);flex:none;display:grid;place-items:center;color:var(--accent-fg)}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:80px 0;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.suggest{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.suggest button{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:10px 12px}
.suggest button:last-child{border-bottom:0}
.empty{text-align:center;padding:40px 10px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekstrip button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.weekstrip button b{font-size:15px;color:var(--fg)}
.weekstrip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.weekstrip button[aria-pressed="true"] b{color:var(--accent-fg)}
.proto{font-size:11px;color:var(--muted);text-align:center}

.thumb{width:64px;height:46px;border-radius:10px;overflow:hidden;flex:none;background:var(--line)}
.thumb svg,.heroimg svg,.cover svg{display:block;width:100%;height:100%}
.heroimg{border-radius:14px;overflow:hidden;aspect-ratio:400/260;max-width:100%}
.cover{border-radius:16px;overflow:hidden;aspect-ratio:400/230;max-width:100%;margin-top:2px}
.alt .row .thumb{width:84px;height:60px}
.group{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.group>button{width:100%;border:0;background:transparent;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:600;text-align:left}
.group>button .plus{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:18px;line-height:1;flex:none}
.group .chips{padding:0 14px 14px}
.member{display:flex;flex-direction:column;gap:10px}
.member .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.member .grid2 label.field{font-size:13px}
.kcal{display:flex;flex-direction:column;gap:6px}
.kbar{position:relative;height:10px;border-radius:999px;background:var(--line);overflow:visible}
.kbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.kbar>b{position:absolute;top:-3px;width:3px;height:16px;border-radius:2px;background:var(--saffron)}
.macros{display:flex;flex-wrap:wrap;gap:6px}
.macro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;min-width:64px}
.macro b{font-size:16px;font-variant-numeric:tabular-nums}
.macro span{font-size:11px;color:var(--muted)}
.eat{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.eat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip small{opacity:.75;font-size:12px}

.drag{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;width:24px;height:40px;flex:none;cursor:grab;touch-action:none;padding:0;margin-left:-6px}
.drag.ghost{cursor:default}
.slot.dragsrc{opacity:.35}
.slot.droptarget{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.dragghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 6px;box-shadow:var(--shadow);max-width:280px}
.dragghost .dish{font-size:14px}

.stepcard{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stepcard.done{opacity:.6}
.stepimg{border-radius:10px;overflow:hidden;aspect-ratio:400/220;width:100%}
.stepimg svg{display:block;width:100%;height:100%}
.steptext{border:0;background:transparent;text-align:left;padding:0;display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5}
.stepn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.stepcard.done .stepn{background:var(--accent);color:var(--accent-fg)}
.vv{text-decoration:none;font-size:12px}
.cook{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;max-width:480px;margin:0 auto}
html.cooking body{overflow:hidden}
.cookhead{display:flex;align-items:center;gap:12px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--card)}
.cookbody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cookbody>*{flex-shrink:0}
.cookfoot{display:flex;justify-content:space-between;gap:12px;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--card)}
.cookfoot .btn{flex:1}
.cooktext{font-size:20px;line-height:1.45;font-weight:500}
.timerbox{align-items:center;text-align:center}
.bigtime{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.tstrip{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:var(--saffron-soft)}
.tchip{font-size:13px;font-weight:600;color:var(--saffron);font-variant-numeric:tabular-nums}
.tchip.done{color:var(--danger)}
.chk2{width:20px;height:20px;accent-color:var(--accent)}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:12px;background:var(--bg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.appbar b{font-size:17px}
.burger{border:0;background:transparent;color:var(--fg);padding:0;min-width:32px}
.avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;display:grid;place-items:center;flex:none}
.avatar.big{width:48px;height:48px;font-size:20px}
.dscrim{position:fixed;inset:0;z-index:50;background:var(--scrim)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(320px,86vw);background:var(--card);display:flex;flex-direction:column;gap:2px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);box-shadow:var(--shadow);overflow:auto;animation:slidein .2s ease-out}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}}
.duser{display:flex;align-items:center;gap:12px;padding:8px 16px 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.ditem{border:0;background:transparent;display:flex;align-items:center;gap:14px;padding:12px 16px;text-align:left;color:var(--fg)}
.ditem svg{color:var(--accent);flex:none;width:22px;height:22px}
.ditem:hover{background:var(--bg)}
.onbscreen{min-height:100vh;min-height:100dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.introart{min-height:260px;justify-content:center}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.introlist{gap:12px}
.chkfake{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:inline-block;margin-right:8px}
.codeinput{font-size:32px;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.bigcount{flex-direction:row;align-items:center;justify-content:space-between;padding:16px}
.stepper.big button{width:48px;height:48px;font-size:24px}
.stepper.big span{min-width:40px;font-size:20px}
.optcard{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.optcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}

.promo{gap:8px}
.pricebox{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.pricebox b{font-size:18px;font-variant-numeric:tabular-nums}
.pricebox s{font-size:13px;color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.compare b{font-size:20px;font-variant-numeric:tabular-nums}

.sheet>*{flex-shrink:0}
.cover,.heroimg{width:100%;flex:none}
.hero .heroimg{margin:-4px -4px 2px}
.screen{padding-top:14px}
.togglecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.seg{flex-wrap:nowrap}
.ditem.locked{opacity:.75}
.ditem.locked svg{color:var(--muted)}
.ditem .pill{flex:none}
.newcard{border-color:var(--accent);background:var(--accent-soft)}
.newic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--card);color:var(--accent);display:grid;place-items:center}
.newic svg{width:22px;height:22px}
.lockcard{background:transparent;border-style:dashed}
.lockcard svg{color:var(--muted);flex:none}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statgrid>div{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:10px;padding:8px 10px}
.statgrid b{font-size:24px;font-variant-numeric:tabular-nums}

.btn svg{width:18px;height:18px;flex:none}
.famview .slot{cursor:default}
a.btn{text-decoration:none}

 {id:'b7',n:'Рисовая каша на молоке',m:'b',t:30,tags:['porridge','kids','ru'],art:'bowl:milk,ricegrain',i:[['rice',200],['milk',900],['butter',30],['sugar',30]],sp:['соль'],s:['Отварите рис в 400 мл воды 10 минут.','Влейте молоко, добавьте сахар и соль.','Варите на слабом огне 15 минут, помешивая.','Добавьте масло и дайте постоять 5 минут.']},
 {id:'b8',n:'Овсянка на воде с ягодами и бананом',m:'b',t:10,tags:['porridge','quick'],art:'bowl:oatmeal,berries,banana,nuts',i:[['oats',200],['berries',200],['banana',2],['walnuts',40]],sp:['соль'],s:['Залейте хлопья 700 мл кипятка, посолите, варите 5 минут.','Добавьте ягоды, прогрейте минуту.','Сверху — банан кружками и рубленые орехи.']},
 {id:'b9',n:'Яичница с помидорами и тостами',m:'b',t:10,tags:['quick','kids'],art:'pan:egg,tomato,greens',i:[['eggs',8],['tomato',300],['bread',0.5],['oil',20]],sp:['соль','перец'],s:['Нарежьте помидоры и хлеб.','Подсушите хлеб на сухой сковороде.','Обжарьте помидоры 2 минуты, вбейте яйца.','Посолите и жарьте под крышкой 3–4 минуты.']},
 {id:'b10',n:'Рисовая каша на воде с яблоком',m:'b',t:25,tags:['porridge','kids'],art:'bowl:ricegrain,apple',i:[['rice',200],['apple',2],['sugar',30],['oil',10]],sp:['соль','корица'],s:['Промойте рис, залейте 700 мл воды, посолите.','Варите на слабом огне 15 минут.','Добавьте тёртые яблоки, сахар и корицу, варите 5 минут.','Добавьте ложку масла, дайте постоять.']},
 {id:'b11',n:'Гречка с яйцом и огурцом',m:'b',t:20,tags:['porridge'],art:'plate:buckwheat,egg,cucumber',i:[['buckwheat',240],['eggs',4],['cucumber',200],['oil',10]],sp:['соль'],s:['Отварите гречку: 240 г на 480 мл воды, 15 минут.','Сварите яйца вкрутую.','Нарежьте огурцы и яйца.','Подавайте вместе, заправьте маслом.']},
 {id:'b12',n:'Творог с ягодами и мёдом',m:'b',t:5,tags:['quick'],art:'bowl:cottage,berries',i:[['cottage',600],['berries',200],['honey',40]],sp:[],s:['Разморозьте ягоды или прогрейте их минуту в микроволновке.','Разложите творог по тарелкам.','Сверху — ягоды и мёд.']},
 {id:'b13',n:'Пшённая каша с тыквой',m:'b',t:35,tags:['porridge','ru','kids'],art:'bowl:millet,pumpkin',i:[['millet',200],['pumpkin',300],['milk',600],['butter',20],['sugar',20]],sp:['соль'],s:['Промойте пшено несколько раз горячей водой.','Нарежьте тыкву мелким кубиком.','Залейте пшено и тыкву молоком с 200 мл воды, посолите.','Варите на слабом огне 25 минут, добавьте сахар и масло.']},
 {id:'b14',n:'Скрэмбл из тофу со шпинатом',m:'b',t:15,tags:['quick','asia'],art:'pan:tofu,spinach,tomato',i:[['tofu',400],['spinach',100],['tomato',200],['onion',80],['oil',20]],sp:['соль','куркума','перец'],s:['Обжарьте нарезанный лук 3 минуты.','Раскрошите тофу руками в сковороду, добавьте куркуму и соль.','Жарьте 5 минут, затем добавьте помидоры и шпинат.','Прогрейте ещё 2 минуты.']},
 {id:'b15',n:'Тосты с авокадо и яйцом',m:'b',t:15,tags:['quick'],art:'board:toast,avocado,egg',i:[['bread',0.5],['avocado',2],['eggs',4],['lemon',0.5]],sp:['соль','перец'],s:['Подсушите хлеб в тостере или на сковороде.','Разомните авокадо с лимонным соком, солью и перцем.','Сварите яйца всмятку (6 минут) или пашот.','Намажьте авокадо на тосты, сверху — яйцо.']},
 {id:'b16',n:'Домашняя гранола с йогуртом',m:'b',t:30,tags:['baked','keeps'],art:'bowl:yogurt,granola,berries',i:[['oats',200],['honey',50],['walnuts',60],['oil',20],['yogurt',600],['berries',150]],sp:['корица'],s:['Смешайте хлопья, рубленые орехи, мёд, масло и корицу.','Выложите на противень и запекайте 20 минут при 160 °C, перемешав в середине.','Остудите — гранола хранится в банке неделю.','Подавайте с йогуртом и ягодами.']},
 {id:'b17',n:'Оладьи на кефире',m:'b',t:30,tags:['kids','pancake','ru'],art:'plate:syrniki,sourcream',i:[['flour',250],['kefir',500],['eggs',1],['sugar',30],['oil',40],['sour_cream',150]],sp:['соль','сода ½ ч. л.'],s:['Смешайте тёплый кефир, яйцо, сахар, соль и соду.','Всыпьте муку — тесто должно быть как густая сметана.','Жарьте оладьи на масле по 2 минуты с каждой стороны.','Подавайте со сметаной.']},
 {id:'b18',n:'Белковый омлет с курицей и шпинатом',m:'b',t:15,tags:['quick'],art:'pan:omelet,chicken,spinach',i:[['eggs',8],['chicken_fillet',200],['spinach',100],['milk',100],['oil',10]],sp:['соль','перец'],s:['Нарежьте филе небольшими кусочками и обжарьте 6 минут.','Добавьте шпинат, прогрейте минуту.','Взбейте яйца с молоком и солью, залейте.','Готовьте под крышкой 6 минут.']},
 {id:'b19',n:'Овсяноблин с сыром',m:'b',t:15,tags:['quick','pancake'],art:'pan:omelet,cheese,greens',i:[['oats',120],['eggs',4],['milk',120],['cheese',80],['oil',10]],sp:['соль'],s:['Смешайте хлопья, яйца, молоко и соль, дайте постоять 5 минут.','Вылейте на разогретую сковороду тонким слоем.','Через 3 минуты переверните, посыпьте сыром.','Сложите пополам и подержите под крышкой минуту.']},
 {id:'b20',n:'Бутерброды с хумусом и овощами',m:'b',t:15,tags:['quick','cauc'],art:'board:toast,hummus,cucumber',i:[['bread',0.5],['chickpeas',1],['sesame',30],['lemon',0.5],['garlic',1],['oil',30],['cucumber',200],['tomato',200]],sp:['соль','зира'],s:['Пробейте блендером нут, кунжут, лимонный сок, чеснок, масло и 3 ложки воды.','Посолите и добавьте зиру.','Намажьте хумус на хлеб.','Сверху — огурцы и помидоры.']},

 {id:'b21',n:'Тосты с арахисовой пастой и бананом',m:'b',t:5,tags:['quick','kids'],art:'board:toast,peanut,banana',i:[['bread',0.5],['peanut_butter',80],['banana',2]],sp:[],s:['Подсушите хлеб в тостере.','Намажьте арахисовую пасту.','Сверху — банан кружками.']},
 {id:'b22',n:'Сырники с апельсином и йогуртом',m:'b',t:30,tags:['pancake','kids'],art:'plate:syrniki,yogurt_dollop,orange',i:[['cottage',500],['eggs',1],['flour',70],['sugar',30],['orange',1],['oil',30],['yogurt',200]],sp:['соль'],s:['Натрите цедру апельсина и добавьте в творог с яйцом и сахаром.','Всыпьте муку, сформируйте сырники.','Обжарьте по 3–4 минуты с каждой стороны.','Подавайте с йогуртом и дольками апельсина.']},

 {id:'m1',n:'Курица с картофелем в духовке',m:'m',t:60,tags:['kids','baked','ru','keeps'],art:'tray:potato,roast,greens',i:[['chicken_thigh',1000],['potato',1000],['onion',150],['garlic',3],['sour_cream',100],['oil',20]],sp:['соль','перец','паприка'],s:['Разогрейте духовку до 200 °C.','Смешайте сметану с чесноком и специями, обмажьте курицу.','Нарежьте картофель дольками, лук полукольцами, перемешайте с маслом.','Выложите картофель в форму, сверху курицу.','Запекайте 45 минут.']},
 {id:'m2',n:'Куриные котлеты с гречкой',m:'m',t:45,tags:['kids','cutlets','ru'],art:'plate:buckwheat,cutlet,cucumber',i:[['chicken_fillet',700],['onion',100],['eggs',1],['flour',30],['buckwheat',300],['oil',40]],sp:['соль','перец'],s:['Поставьте вариться гречку: 300 г на 600 мл воды.','Мелко порубите филе и лук.','Добавьте яйцо, муку, соль, перец.','Сформируйте котлеты и обжарьте по 5 минут с каждой стороны, затем 5 минут под крышкой.']},
 {id:'m3',n:'Плов с курицей',m:'m',t:60,tags:['cauc','keeps'],art:'plate:plov',i:[['chicken_thigh',700],['rice',400],['carrot',300],['onion',200],['garlic',6],['oil',60]],sp:['соль','зира','барбарис'],s:['Нарежьте курицу, морковь соломкой, лук полукольцами.','Обжарьте курицу 7 минут, добавьте лук и морковь, жарьте 10 минут.','Добавьте специи и 300 мл воды, тушите 10 минут.','Выложите рис, залейте водой на 1,5 см выше.','Воткните головку чеснока, варите до испарения воды, затем 20 минут под крышкой.']},
 {id:'m4',n:'Макароны по-флотски',m:'m',t:30,tags:['kids','pasta','ru','mince'],art:'plate:pasta,mince',i:[['minced_mix',500],['pasta',400],['onion',150],['tomato_paste',40],['oil',20]],sp:['соль','перец'],s:['Отварите макароны.','Обжарьте лук 3 минуты.','Добавьте фарш, жарьте 10 минут.','Добавьте томатную пасту и 100 мл воды, тушите 5 минут.','Смешайте с макаронами.']},
 {id:'m5',n:'Борщ',m:'m',t:90,tags:['soup','ru','keeps'],art:'bowl:soup_red,beef,cabbage,sourcream,greens',i:[['beef',500],['beet',300],['cabbage',400],['potato',400],['carrot',150],['onion',150],['tomato_paste',50],['oil',30],['sour_cream',150],['greens',1]],sp:['соль','лавровый лист','перец горошком'],s:['Сварите бульон из говядины в 2,5 л воды, 60 минут.','Обжарьте лук, морковь и тёртую свёклу, добавьте томатную пасту.','Добавьте в бульон картофель, через 10 минут — капусту.','Через 5 минут — зажарку, лавровый лист и соль, варите 10 минут.','Подавайте со сметаной и зеленью.']},
 {id:'m6',n:'Куриный суп с вермишелью',m:'m',t:45,tags:['soup','kids','ru'],art:'bowl:soup_gold,noodles,chicken,carrot,greens',i:[['chicken_thigh',500],['noodles',150],['potato',300],['carrot',120],['onion',100],['greens',1]],sp:['соль','лавровый лист'],s:['Сварите курицу в 2 л воды, 25 минут.','Отделите мясо от костей.','Добавьте картофель, морковь и лук, варите 10 минут.','Всыпьте вермишель и верните мясо, варите 5 минут.','Добавьте зелень.']},
 {id:'m7',n:'Гуляш из говядины с пюре',m:'m',t:90,tags:['ru','stew','keeps'],art:'plate:mash,beef_sauce',i:[['beef',700],['onion',200],['carrot',150],['tomato_paste',40],['flour',20],['potato',1000],['milk',150],['butter',40],['oil',30]],sp:['соль','перец','паприка','лавровый лист'],s:['Обжарьте говядину кубиками до корочки.','Добавьте лук и морковь, затем муку и томатную пасту.','Влейте 500 мл воды, тушите под крышкой 70 минут.','Отварите картофель и разомните с молоком и маслом.']},
 {id:'m8',n:'Рыбные котлеты с рисом',m:'m',t:40,tags:['kids','cutlets','whitefish'],art:'plate:rice,cutlet_fish,cucumber',i:[['fish_white',700],['onion',100],['eggs',1],['flour',30],['rice',300],['cucumber',300],['oil',40]],sp:['соль','перец'],s:['Отварите рис.','Измельчите филе и лук, добавьте яйцо, муку, соль.','Сформируйте котлеты, обжарьте по 4 минуты с каждой стороны.','Подавайте с рисом и огурцами.']},
 {id:'m9',n:'Минтай, запечённый с овощами',m:'m',t:35,tags:['baked','whitefish'],art:'tray:zucchini,fish,tomato,lemon',i:[['fish_white',800],['zucchini',400],['tomato',300],['onion',100],['oil',30],['lemon',1]],sp:['соль','перец','травы'],s:['Разогрейте духовку до 190 °C.','Нарежьте кабачки и помидоры кружками.','Выложите овощи в форму, сверху рыбу, сбрызните маслом и лимоном.','Посолите и запекайте 25 минут.']},
 {id:'m10',n:'Сёмга с брокколи и рисом',m:'m',t:30,tags:['quick'],art:'plate:rice,salmon,broccoli',i:[['salmon',600],['broccoli',400],['rice',300],['lemon',1],['butter',20]],sp:['соль','перец'],s:['Отварите рис.','Посолите рыбу, сбрызните лимоном и запекайте 15 минут при 200 °C.','Отварите брокколи 5 минут, заправьте маслом.']},
 {id:'m11',n:'Тефтели в томатном соусе с рисом',m:'m',t:50,tags:['kids','ru','mince','keeps'],art:'plate:rice,meatballs',i:[['minced_mix',600],['rice',300],['onion',150],['carrot',100],['canned_tomatoes',1],['sour_cream',100],['eggs',1]],sp:['соль','перец'],s:['Отварите 100 г риса до полуготовности.','Смешайте фарш, рис, яйцо, половину лука, скатайте тефтели.','Обжарьте лук с морковью, добавьте томаты и сметану.','Тушите тефтели в соусе 25 минут.','Отварите остальной рис на гарнир.']},
 {id:'m12',n:'Паста с курицей и грибами в сливках',m:'m',t:30,tags:['pasta','it'],art:'plate:pasta_cream,chicken,mushroom,greens',i:[['chicken_fillet',500],['mushrooms',300],['cream',300],['pasta',400],['cheese',60],['garlic',2],['oil',20]],sp:['соль','перец'],s:['Отварите пасту.','Обжарьте филе 6 минут, добавьте грибы и чеснок.','Влейте сливки, прогрейте 3 минуты.','Смешайте с пастой, посыпьте сыром.']},
 {id:'m13',n:'Овощное рагу с индейкой',m:'m',t:50,tags:['stew','keeps'],art:'bowl:stew,turkey,zucchini,carrot,pepper',i:[['turkey',500],['zucchini',400],['potato',500],['carrot',150],['bell_pepper',200],['onion',100],['tomato',300],['oil',30]],sp:['соль','перец','паприка'],s:['Нарежьте индейку и овощи кубиками.','Обжарьте индейку 7 минут, добавьте лук и морковь.','Добавьте картофель и 200 мл воды, тушите 15 минут.','Добавьте кабачки, перец, помидоры и тушите 15 минут.']},
 {id:'m14',n:'Суп из красной чечевицы',m:'m',t:40,tags:['soup','cauc','keeps'],art:'bowl:soup_orange,lentil,greens',i:[['lentils',300],['potato',300],['carrot',150],['onion',150],['canned_tomatoes',1],['garlic',2],['oil',30]],sp:['соль','зира','куркума'],s:['Обжарьте лук, морковь и чеснок.','Добавьте чечевицу, картофель и томаты.','Залейте 1,5 л воды, варите 25 минут.','Добавьте специи, при желании пробейте блендером.']},
 {id:'m15',n:'Ленивые голубцы',m:'m',t:60,tags:['kids','baked','ru','mince','keeps'],art:'tray:golubtsy,sourcream',i:[['minced_mix',500],['cabbage',500],['rice',150],['onion',100],['carrot',100],['tomato_paste',40],['sour_cream',150]],sp:['соль','перец'],s:['Отварите рис до полуготовности.','Нашинкуйте капусту, обдайте кипятком и отожмите.','Смешайте фарш, капусту и рис, сформируйте голубцы.','Сделайте соус из лука, моркови, пасты и сметаны.','Залейте и запекайте 35 минут при 180 °C.']},
 {id:'m16',n:'Курица терияки с рисом',m:'m',t:30,tags:['asia'],art:'plate:rice,chicken_glaze,pepper,sesame',i:[['chicken_fillet',700],['soy_sauce',80],['sugar',30],['garlic',3],['rice',300],['bell_pepper',200],['sesame',10],['oil',20]],sp:[],s:['Отварите рис.','Смешайте соевый соус, сахар, чеснок и 50 мл воды.','Обжарьте филе 6 минут, добавьте перец.','Влейте соус и уварите до глянца, посыпьте кунжутом.']},
 {id:'m17',n:'Гречка с грибами и луком',m:'m',t:30,tags:['ru'],art:'plate:buckwheat,mushroom,carrot',i:[['buckwheat',400],['mushrooms',400],['onion',200],['carrot',100],['oil',40]],sp:['соль','перец'],s:['Отварите гречку.','Обжарьте лук и морковь 5 минут.','Добавьте грибы, жарьте до испарения жидкости.','Смешайте с гречкой.']},
 {id:'m18',n:'Картофельная запеканка с индейкой',m:'m',t:60,tags:['kids','baked','casserole','mince'],art:'tray:mash,cheese',i:[['minced_turkey',600],['potato',1000],['onion',150],['cheese',120],['milk',150],['eggs',1],['butter',30],['oil',20]],sp:['соль','перец'],s:['Сделайте пюре с молоком, маслом и яйцом.','Обжарьте фарш с луком 10 минут.','Выложите слоями: пюре, фарш, пюре.','Посыпьте сыром, запекайте 25 минут при 190 °C.']},
 {id:'m19',n:'Фасоль в томате с овощами',m:'m',t:25,tags:['stew'],art:'bowl:sauce_red,beans,pepper,greens',i:[['beans',2],['canned_tomatoes',1],['onion',150],['bell_pepper',200],['garlic',2],['oil',30],['bread',1]],sp:['соль','паприка'],s:['Обжарьте лук, перец и чеснок 6 минут.','Добавьте томаты, тушите 5 минут.','Добавьте фасоль, прогрейте 5 минут.','Подавайте с хлебом.']},
 {id:'m20',n:'Отбивные из свинины с салатом',m:'m',t:35,tags:['ru'],art:'plate:chop,cucumber,tomato',i:[['pork',700],['flour',40],['eggs',2],['oil',50],['cucumber',300],['tomato',300],['sour_cream',80]],sp:['соль','перец'],s:['Отбейте свинину.','Обваляйте в муке и яйце.','Жарьте по 4 минуты с каждой стороны.','Заправьте огурцы и помидоры сметаной.']},
 {id:'m21',n:'Щи из свежей капусты с курицей',m:'m',t:60,tags:['soup','ru','keeps'],art:'bowl:soup_gold,cabbage,carrot,sourcream,greens',i:[['chicken_thigh',500],['cabbage',500],['potato',400],['carrot',120],['onion',100],['tomato',200],['sour_cream',120],['greens',1]],sp:['соль','лавровый лист'],s:['Сварите бульон 30 минут.','Добавьте картофель, через 10 минут — капусту.','Добавьте обжаренные лук, морковь и помидор.','Варите 10 минут, подавайте со сметаной.']},
 {id:'m22',n:'Домашняя шаурма с курицей',m:'m',t:30,tags:['kids','cauc'],art:'board:wrap',i:[['chicken_fillet',600],['lavash',4],['cucumber',250],['tomato',250],['cabbage',200],['sour_cream',150],['garlic',2],['oil',20]],sp:['соль','паприка','карри'],s:['Обжарьте курицу со специями 8 минут.','Смешайте сметану с чесноком.','Нарежьте овощи соломкой.','Заверните начинку в лаваш с соусом и подрумяньте на сухой сковороде.']},
 {id:'m23',n:'Драники со сметаной',m:'m',t:40,tags:['kids','pancake','ru'],art:'plate:draniki,sourcream,greens',i:[['potato',1200],['onion',100],['eggs',2],['flour',60],['oil',60],['sour_cream',200]],sp:['соль','перец'],s:['Натрите картофель и лук, отожмите.','Добавьте яйца, муку, соль.','Жарьте по 3–4 минуты с каждой стороны.','Подавайте со сметаной.']},
 {id:'m24',n:'Паста с томатами и сыром',m:'m',t:25,tags:['pasta','it','kids'],art:'plate:pasta_red,cheese,greens',i:[['pasta',400],['canned_tomatoes',1],['garlic',3],['cheese',100],['oil',30],['greens',1]],sp:['соль'],s:['Отварите пасту.','Обжарьте чеснок, добавьте томаты, тушите 10 минут.','Смешайте с пастой, посыпьте сыром и зеленью.']},
 {id:'m25',n:'Жареный рис с яйцом и овощами',m:'m',t:25,tags:['asia'],art:'pan:friedrice,egg_bits,peas,carrot',i:[['rice',300],['eggs',4],['carrot',150],['bell_pepper',200],['green_peas',150],['soy_sauce',50],['oil',30]],sp:['соль'],s:['Отварите рис заранее и остудите.','Обжарьте морковь, перец и горошек 5 минут.','Вбейте яйца и перемешайте до готовности.','Добавьте рис и соевый соус, жарьте 4 минуты на сильном огне.']},
 {id:'m26',n:'Креветки с чесноком и рисом',m:'m',t:25,tags:['asia'],art:'plate:rice,shrimp,lemon,greens',i:[['shrimp',500],['rice',300],['garlic',4],['butter',30],['lemon',1],['greens',1]],sp:['соль','перец'],s:['Отварите рис.','Растопите масло, обжарьте чеснок 30 секунд.','Добавьте креветки, жарьте 3–4 минуты.','Сбрызните лимоном, посыпьте зеленью.']},
 {id:'m27',n:'Кальмары в сметане с картофелем',m:'m',t:35,tags:['ru'],art:'plate:potato,squid,sourcream',i:[['squid',600],['onion',150],['sour_cream',200],['potato',800],['oil',20]],sp:['соль','перец'],s:['Отварите картофель.','Нарежьте кальмары кольцами, лук полукольцами.','Обжарьте лук, добавьте кальмары на 2 минуты.','Влейте сметану, прогрейте 3 минуты — не дольше, иначе станут жёсткими.']},
 {id:'m28',n:'Салат с тунцом, яйцом и овощами',m:'m',t:15,tags:['salad','quick'],art:'bowl:lettuce,tuna,egg_half,tomato,cucumber',i:[['tuna',2],['eggs',4],['cucumber',300],['tomato',300],['lettuce',200],['oil',30],['mustard',10],['lemon',0.5]],sp:['соль','перец'],s:['Сварите яйца вкрутую.','Нарежьте овощи и порвите салат.','Смешайте масло, горчицу и лимонный сок.','Выложите овощи, тунец и яйца, полейте заправкой.']},
 {id:'m29',n:'Карри из нута с цветной капустой',m:'m',t:35,tags:['asia','stew','keeps'],art:'bowl:curry,chickpeas,cauli,greens',i:[['chickpeas',2],['coconut_milk',1],['cauliflower',400],['carrot',150],['onion',150],['garlic',3],['rice',300],['oil',20]],sp:['соль','карри','куркума'],s:['Отварите рис.','Обжарьте лук, чеснок и морковь с карри 5 минут.','Добавьте капусту соцветиями и кокосовое молоко, тушите 10 минут.','Добавьте нут, прогрейте 5 минут. Подавайте с рисом.']},
 {id:'m30',n:'Лобио из красной фасоли',m:'m',t:30,tags:['cauc','stew','keeps'],art:'bowl:sauce_red,beans,nuts,greens',i:[['beans',3],['onion',200],['walnuts',80],['garlic',3],['greens',1],['tomato_paste',30],['oil',30]],sp:['соль','хмели-сунели','кинза по желанию'],s:['Обжарьте лук до золотистого цвета.','Добавьте фасоль, томатную пасту и 150 мл воды.','Измельчите орехи с чесноком, добавьте к фасоли.','Тушите 10 минут, посыпьте зеленью.']},
 {id:'m31',n:'Булгур с овощами и нутом',m:'m',t:30,tags:['cauc'],art:'plate:bulgur,chickpeas,zucchini,pepper,greens',i:[['bulgur',300],['chickpeas',1],['zucchini',300],['bell_pepper',200],['tomato',200],['oil',30],['lemon',0.5]],sp:['соль','зира'],s:['Обжарьте булгур в масле 2 минуты, залейте 600 мл воды.','Варите под крышкой 15 минут.','Обжарьте кабачки и перец, добавьте помидоры и нут.','Смешайте с булгуром, сбрызните лимоном.']},
 {id:'m32',n:'Тофу с брокколи в соевом соусе',m:'m',t:25,tags:['asia','quick'],art:'plate:rice,tofu,broccoli,sesame',i:[['tofu',400],['broccoli',400],['rice',300],['soy_sauce',50],['garlic',2],['sesame',15],['oil',20]],sp:[],s:['Отварите рис.','Обжарьте тофу кубиками до корочки.','Добавьте брокколи и чеснок, жарьте 4 минуты.','Влейте соевый соус, посыпьте кунжутом.']},
 {id:'m33',n:'Грибной суп с картофелем',m:'m',t:40,tags:['soup','ru'],art:'bowl:soup_beige,mushroom,potato_cubes,greens',i:[['mushrooms',400],['potato',500],['carrot',120],['onion',120],['oil',30],['greens',1]],sp:['соль','лавровый лист'],s:['Обжарьте лук, морковь и грибы 10 минут.','Залейте 2 л воды, добавьте картофель.','Варите 20 минут, посолите.','Подавайте с зеленью.']},
 {id:'m34',n:'Овощное рагу с баклажанами',m:'m',t:45,tags:['stew','cauc','keeps'],art:'bowl:stew,eggplant,zucchini,pepper,greens',i:[['eggplant',500],['zucchini',300],['bell_pepper',300],['tomato',400],['onion',150],['garlic',3],['oil',40]],sp:['соль','перец'],s:['Нарежьте овощи кубиками.','Обжарьте лук и баклажаны 7 минут.','Добавьте перец и кабачки, затем помидоры и чеснок.','Тушите под крышкой 20 минут.']},
 {id:'m35',n:'Куриная грудка с киноа и овощами',m:'m',t:30,tags:[],art:'plate:quinoa,chicken_grill,broccoli,pepper',i:[['chicken_fillet',700],['quinoa',250],['broccoli',300],['bell_pepper',200],['oil',20],['lemon',0.5]],sp:['соль','перец','паприка'],s:['Промойте киноа и варите 15 минут в 500 мл воды.','Натрите филе специями и обжарьте по 6 минут с каждой стороны.','Отварите брокколи 5 минут, нарежьте перец.','Нарежьте филе и подавайте с киноа и овощами.']},
 {id:'m36',n:'Индейка с булгуром и кабачками',m:'m',t:35,tags:[],art:'plate:bulgur,turkey,zucchini',i:[['turkey',600],['bulgur',250],['zucchini',300],['carrot',120],['onion',100],['oil',20]],sp:['соль','перец'],s:['Обжарьте булгур 2 минуты, залейте 500 мл воды, варите 15 минут.','Нарежьте индейку и обжарьте 8 минут.','Добавьте лук, морковь и кабачки, тушите 10 минут.','Подавайте с булгуром.']},
 {id:'m37',n:'Лапша с говядиной и овощами',m:'m',t:30,tags:['asia','pasta'],art:'pan:noodles,beef,pepper,carrot',i:[['beef',500],['noodles',300],['bell_pepper',200],['carrot',150],['onion',100],['soy_sauce',60],['garlic',2],['oil',30]],sp:[],s:['Отварите лапшу.','Нарежьте говядину тонкими полосками и обжарьте на сильном огне 4 минуты.','Добавьте овощи соломкой, жарьте 4 минуты.','Добавьте лапшу и соевый соус, перемешайте.']},
 {id:'m38',n:'Уха из трески',m:'m',t:40,tags:['soup','ru','whitefish'],art:'bowl:soup_clear,fish,potato_cubes,carrot,greens',i:[['cod',600],['potato',400],['carrot',120],['onion',120],['greens',1]],sp:['соль','перец горошком','лавровый лист'],s:['Доведите 2 л воды до кипения, добавьте картофель, морковь и лук.','Варите 15 минут.','Добавьте рыбу кусками, варите 7 минут.','Посолите, добавьте специи и зелень.']},
 {id:'m39',n:'Куриная печень в сметане с пюре',m:'m',t:35,tags:['ru'],art:'plate:mash,liver,greens',i:[['chicken_liver',600],['onion',200],['sour_cream',150],['potato',1000],['milk',150],['butter',30],['oil',20]],sp:['соль','перец'],s:['Отварите картофель и разомните с молоком и маслом.','Обжарьте лук 5 минут.','Добавьте печень, жарьте 5 минут.','Влейте сметану и тушите 5 минут.']},
 {id:'m40',n:'Перец, фаршированный мясом и рисом',m:'m',t:70,tags:['ru','stew','mince','keeps'],art:'bowl:sauce_red,stuffed_pepper,sourcream',i:[['bell_pepper',1000],['minced_mix',500],['rice',150],['onion',100],['carrot',100],['tomato_paste',40],['sour_cream',150]],sp:['соль','перец'],s:['Отварите рис до полуготовности.','Смешайте фарш, рис, половину лука, соль и перец.','Начините очищенные перцы.','Сложите в кастрюлю, залейте соусом из пасты, моркови, лука и 500 мл воды.','Тушите 45 минут. Подавайте со сметаной.']},
 {id:'m41',n:'Тыквенный крем-суп',m:'m',t:35,tags:['soup'],art:'bowl:soup_orange,cream_swirl,pumpkin_seeds',i:[['pumpkin',800],['potato',200],['onion',100],['carrot',100],['cream',200],['oil',20]],sp:['соль','мускатный орех'],s:['Обжарьте лук и морковь.','Добавьте тыкву и картофель кубиками, залейте 800 мл воды.','Варите 20 минут, пробейте блендером.','Влейте сливки, прогрейте.']},
 {id:'m42',n:'Тушёная капуста с курицей',m:'m',t:50,tags:['ru','stew','keeps'],art:'bowl:stew,cabbage,chicken,carrot',i:[['cabbage',1000],['chicken_thigh',600],['carrot',150],['onion',150],['tomato_paste',40],['oil',30]],sp:['соль','перец','лавровый лист'],s:['Обжарьте курицу кусками 10 минут.','Добавьте лук и морковь.','Добавьте нашинкованную капусту, пасту и 200 мл воды.','Тушите под крышкой 30 минут.']},
 {id:'m43',n:'Бефстроганов с гречкой',m:'m',t:45,tags:['ru'],art:'plate:buckwheat,beef_cream,greens',i:[['beef',600],['onion',200],['sour_cream',200],['flour',20],['buckwheat',300],['butter',20]],sp:['соль','перец'],s:['Отварите гречку.','Нарежьте говядину тонкими полосками, обжарьте на сильном огне.','Добавьте лук и муку, перемешайте.','Влейте сметану и 100 мл воды, тушите 15 минут.']},
 {id:'m44',n:'Запеканка из брокколи и цветной капусты',m:'m',t:40,tags:['baked','casserole'],art:'tray:cauli,broccoli,cheese',i:[['cauliflower',500],['broccoli',400],['eggs',3],['milk',200],['cheese',150]],sp:['соль','мускатный орех'],s:['Отварите капусту 5 минут.','Выложите в форму.','Взбейте яйца с молоком и солью, залейте.','Посыпьте сыром и запекайте 25 минут при 190 °C.']},
 {id:'m45',n:'Курица с гречкой в духовке',m:'m',t:60,tags:['baked','ru','keeps'],art:'tray:buckwheat,roast,carrot',i:[['chicken_thigh',800],['buckwheat',300],['onion',150],['carrot',150],['oil',20]],sp:['соль','перец','паприка'],s:['Обжарьте лук и морковь, смешайте с сырой гречкой.','Выложите в форму, залейте 600 мл кипятка, посолите.','Сверху — курица, натёртая специями.','Накройте фольгой и запекайте 45 минут при 190 °C.']},
 {id:'m46',n:'Чахохбили из курицы',m:'m',t:55,tags:['cauc','stew','keeps'],art:'bowl:sauce_red,roast,greens',i:[['chicken_thigh',1000],['tomato',600],['onion',300],['garlic',4],['greens',2],['bell_pepper',200]],sp:['соль','хмели-сунели'],s:['Обжарьте курицу на сухой сковороде до корочки.','Добавьте лук, тушите 10 минут.','Добавьте помидоры без кожицы и перец.','Тушите 25 минут, в конце — чеснок, специи и зелень.']},
 {id:'m47',n:'Треска, запечённая с картофелем',m:'m',t:45,tags:['baked','whitefish','casserole'],art:'tray:potato,fish,cheese,greens',i:[['cod',700],['potato',800],['sour_cream',150],['onion',100],['cheese',80]],sp:['соль','перец'],s:['Нарежьте картофель тонкими кружками.','Выложите в форму картофель, лук и рыбу.','Смажьте сметаной и посыпьте сыром.','Запекайте 35 минут при 190 °C.']},
 {id:'m48',n:'Салат «Цезарь» с курицей',m:'m',t:25,tags:['salad'],art:'bowl:lettuce,chicken_grill,croutons,cheese,tomato',i:[['chicken_fillet',500],['lettuce',300],['tomato',200],['cheese',60],['bread',0.3],['eggs',2],['mustard',10],['oil',40],['lemon',0.5],['garlic',1]],sp:['соль','перец'],s:['Обжарьте филе и нарежьте.','Подсушите кубики хлеба на сковороде.','Смешайте масло, горчицу, лимон, чеснок и желток сваренного яйца.','Соберите салат и полейте заправкой.']},
 {id:'m49',n:'Салат с фетой и нутом',m:'m',t:15,tags:['salad','quick'],art:'bowl:lettuce,feta,chickpeas,tomato,cucumber',i:[['feta',200],['chickpeas',1],['cucumber',300],['tomato',300],['bell_pepper',200],['oil',30],['lemon',0.5]],sp:['соль','орегано'],s:['Нарежьте овощи крупно.','Добавьте нут и фету кубиками.','Заправьте маслом и лимонным соком.']},
 {id:'m50',n:'Плов с нутом',m:'m',t:55,tags:['cauc','keeps'],art:'plate:plov_veg,chickpeas',i:[['rice',400],['chickpeas',1],['carrot',300],['onion',200],['garlic',6],['oil',60]],sp:['соль','зира','барбарис'],s:['Обжарьте лук и морковь соломкой 10 минут.','Добавьте специи и нут.','Выложите рис, залейте водой на 1,5 см выше.','Воткните чеснок и готовьте как обычный плов: до испарения воды, затем 20 минут под крышкой.']},
 {id:'m51',n:'Паста с тунцом и томатами',m:'m',t:20,tags:['pasta','it'],art:'plate:pasta_red,tuna,greens',i:[['pasta',400],['tuna',2],['canned_tomatoes',1],['garlic',2],['oil',20]],sp:['соль','орегано'],s:['Отварите пасту.','Обжарьте чеснок, добавьте томаты, тушите 7 минут.','Добавьте тунец, прогрейте.','Смешайте с пастой.']},
 {id:'m52',n:'Суп с фрикадельками',m:'m',t:40,tags:['soup','kids','ru','mince'],art:'bowl:soup_gold,meatball_small,carrot,peas,greens',i:[['minced_turkey',400],['potato',400],['carrot',120],['onion',100],['green_peas',150],['greens',1]],sp:['соль','лавровый лист'],s:['Скатайте из фарша с солью маленькие фрикадельки.','Отварите картофель, морковь и лук в 2 л воды 10 минут.','Опустите фрикадельки, варите 10 минут.','Добавьте горошек и зелень.']},
 {id:'m53',n:'Курица в сливочно-чесночном соусе с брокколи',m:'m',t:30,tags:['quick'],art:'pan:sauce_cream,chicken,broccoli',i:[['chicken_fillet',700],['cream',200],['garlic',3],['broccoli',500],['cheese',50]],sp:['соль','перец'],s:['Обжарьте филе кусками 7 минут.','Добавьте брокколи и чеснок.','Влейте сливки, добавьте сыр.','Тушите 5 минут до загустения.']},
 {id:'m54',n:'Свинина, тушённая с картофелем',m:'m',t:70,tags:['ru','stew','keeps'],art:'bowl:stew,beef,potato_cubes,carrot,greens',i:[['pork',600],['potato',1000],['onion',150],['carrot',150],['oil',20]],sp:['соль','перец','лавровый лист'],s:['Обжарьте свинину кусками до корочки.','Добавьте лук и морковь.','Добавьте картофель и воду почти до верха.','Тушите под крышкой 40 минут.']},
 {id:'m55',n:'Овощной суп с фасолью',m:'m',t:35,tags:['soup','it'],art:'bowl:soup_red,beans,zucchini,greens',i:[['beans',1],['potato',300],['zucchini',300],['carrot',120],['onion',100],['celery',100],['canned_tomatoes',1],['oil',20]],sp:['соль','орегано'],s:['Обжарьте лук, морковь и сельдерей.','Добавьте картофель, томаты и 1,5 л воды.','Через 10 минут добавьте кабачки и фасоль.','Варите ещё 10 минут.']},
 // ---- Расширение: завтраки ----
 {id:'b23',n:'Манная каша',m:'b',t:15,tags:['porridge','kids','ru'],art:'bowl:milk,berries',i:[['semolina',120],['milk',1000],['sugar',30],['butter',30]],sp:['соль'],s:['Доведите молоко до кипения на среднем огне, посолите и добавьте сахар.','Тонкой струйкой всыпайте манку, всё время помешивая венчиком, — так не будет комочков.','Убавьте огонь до минимума и варите 3–4 минуты, продолжая помешивать.','Снимите с огня, добавьте сливочное масло и дайте постоять под крышкой 3 минуты.']},
 {id:'b24',n:'Ленивые вареники со сметаной',m:'b',t:30,tags:['kids','ru'],art:'plate:dumplings,sourcream',i:[['cottage',500],['eggs',1],['flour',100],['sugar',30],['butter',20],['sour_cream',150]],sp:['соль'],s:['Разомните творог вилкой до однородности, добавьте яйцо, сахар и щепотку соли.','Всыпьте муку и замесите мягкое тесто — оно может слегка липнуть к рукам.','Раскатайте колбаску толщиной 2 см и нарежьте кусочками по 1,5 см.','Отварите в кипящей подсоленной воде партиями: после всплытия варите 2 минуты.','Достаньте шумовкой, полейте растопленным маслом, подавайте со сметаной.']},
 {id:'b25',n:'Сладкие гренки',m:'b',t:15,tags:['kids','quick'],art:'board:toast,berries',i:[['bread',0.5],['eggs',3],['milk',150],['sugar',20],['butter',20]],sp:['корица'],s:['Взбейте яйца с молоком, сахаром и щепоткой корицы.','Нарежьте батон ломтиками толщиной 1,5 см.','Обмакните каждый ломтик в смесь на 10 секунд с каждой стороны.','Обжарьте на сливочном масле на среднем огне по 2 минуты с каждой стороны до румяности.']},
 {id:'b26',n:'Яйца пашот со шпинатом на тостах',m:'b',t:15,tags:['quick'],art:'board:toast,spinach,egg',i:[['bread',0.5],['eggs',4],['spinach',150],['butter',10]],sp:['соль','перец','уксус 1 ст. л.'],s:['Подсушите ломтики хлеба в тостере или на сухой сковороде.','Прогрейте шпинат на сливочном масле 1–2 минуты, посолите.','Доведите воду до лёгкого кипения, добавьте уксус, сделайте воронку и выпустите яйцо.','Варите 3 минуты, достаньте шумовкой.','Выложите на тост шпинат, сверху яйцо, поперчите.']},
 {id:'b27',n:'Творожные маффины с бананом',m:'b',t:35,tags:['baked','kids'],art:'plate:cookies,banana',i:[['cottage',400],['eggs',2],['oats',100],['sugar',40],['banana',1]],sp:['разрыхлитель ½ ч. л.'],s:['Разогрейте духовку до 180 °C.','Разомните банан и смешайте с творогом, яйцами и сахаром.','Добавьте хлопья и разрыхлитель, дайте постоять 5 минут.','Разложите по формочкам для маффинов на ⅔ высоты.','Выпекайте 25 минут до золотистого цвета.']},
 {id:'b28',n:'Пшённая каша на воде с изюмом',m:'b',t:30,tags:['porridge'],art:'bowl:millet,raisins',i:[['millet',200],['raisins',50],['sugar',20],['oil',10]],sp:['соль'],s:['Промойте пшено 3–4 раза горячей водой — уйдёт горечь.','Залейте 600 мл воды, посолите, доведите до кипения.','Варите на слабом огне под крышкой 20 минут.','Добавьте изюм, сахар и масло, дайте постоять 5 минут.']},
 {id:'b29',n:'Каша «Дружба» из риса и пшена',m:'b',t:35,tags:['porridge','kids','ru'],art:'bowl:milk,millet',i:[['rice',100],['millet',100],['milk',800],['butter',30],['sugar',30]],sp:['соль'],s:['Промойте рис и пшено отдельно, пшено — горячей водой.','Залейте крупы 400 мл воды и варите 10 минут до впитывания.','Влейте молоко, добавьте сахар и соль.','Варите на слабом огне 15 минут, помешивая.','Добавьте масло и дайте постоять под крышкой.']},
 {id:'b30',n:'Фриттата с кабачком и перцем',m:'b',t:25,tags:['baked'],art:'pan:omelet,zucchini,pepper',i:[['eggs',8],['zucchini',200],['bell_pepper',150],['cheese',60],['oil',10]],sp:['соль','перец'],s:['Нарежьте кабачок полукругами, перец полосками.','Обжарьте овощи на сковороде с толстым дном 5 минут.','Взбейте яйца с солью и перцем, залейте овощи.','Посыпьте сыром и готовьте на слабом огне 3 минуты.','Переставьте сковороду в духовку на 10 минут при 190 °C.']},

 // ---- Расширение: супы ----
 {id:'m56',n:'Рассольник с курицей',m:'m',t:70,tags:['soup','ru','keeps'],art:'bowl:soup_gold,potato_cubes,cucumber,carrot,greens',i:[['chicken_thigh',500],['barley',100],['pickles',200],['potato',400],['carrot',120],['onion',100],['oil',20],['greens',1]],sp:['соль','лавровый лист','рассол 100 мл'],s:['Замочите перловку в холодной воде на время варки бульона.','Залейте курицу 2,5 л воды и варите 30 минут, снимая пену.','Добавьте промытую перловку и варите 20 минут.','Обжарьте лук и морковь 5 минут, добавьте натёртые огурцы и тушите ещё 5 минут.','Положите в суп картофель кубиками, через 10 минут — зажарку и рассол.','Варите 5 минут, подавайте с зеленью.']},
 {id:'m57',n:'Гороховый суп со свининой',m:'m',t:90,tags:['soup','ru','keeps'],art:'bowl:soup_gold,peas,beef,greens',i:[['peas_dry',300],['pork',300],['potato',300],['carrot',120],['onion',100],['oil',20],['greens',1]],sp:['соль','лавровый лист'],s:['Замочите горох в холодной воде на 2–3 часа или на ночь.','Залейте свинину 2,5 л воды, доведите до кипения, снимите пену.','Добавьте горох и варите 50 минут до мягкости.','Обжарьте лук и морковь 5 минут.','Добавьте картофель, через 15 минут — зажарку, посолите.','Варите 5 минут и подавайте с зеленью и сухариками.']},
 {id:'m58',n:'Сырный суп с курицей',m:'m',t:40,tags:['soup','kids'],art:'bowl:soup_gold,chicken,potato_cubes,greens',i:[['chicken_fillet',300],['processed_cheese',2],['potato',400],['carrot',100],['onion',80],['oil',15],['greens',1]],sp:['соль'],s:['Залейте курицу 1,8 л воды и варите 20 минут.','Достаньте курицу, нарежьте, бульон оставьте.','Добавьте картофель и варите 10 минут.','Обжарьте лук с морковью 5 минут и положите в суп.','Добавьте плавленый сыр кусочками и мешайте, пока он не растворится.','Верните курицу, прогрейте 2 минуты и посыпьте зеленью.']},
 {id:'m59',n:'Суп харчо',m:'m',t:90,tags:['soup','cauc','keeps'],art:'bowl:soup_red,beef,greens',i:[['beef',500],['rice',100],['onion',200],['tomato_paste',60],['garlic',4],['walnuts',50],['oil',20],['greens',1]],sp:['соль','хмели-сунели','перец'],s:['Сварите говяжий бульон в 2,5 л воды, 60 минут.','Достаньте мясо, нарежьте кусочками.','Добавьте в бульон промытый рис и варите 10 минут.','Обжарьте лук, добавьте томатную пасту и тушите 3 минуты.','Положите зажарку, мясо, рубленые орехи, чеснок и специи, варите 7 минут.','Дайте постоять 10 минут и подавайте с зеленью.']},
 {id:'m60',n:'Куриный суп с рисом',m:'m',t:45,tags:['soup','kids','ru'],art:'bowl:soup_gold,chicken,carrot,greens',i:[['chicken_thigh',500],['rice',100],['potato',300],['carrot',120],['onion',100],['greens',1]],sp:['соль','лавровый лист'],s:['Залейте курицу 2 л воды и варите 25 минут.','Достаньте курицу, отделите мясо от костей.','Добавьте промытый рис и варите 10 минут.','Добавьте картофель, морковь и лук, варите 10 минут.','Верните мясо, посолите и посыпьте зеленью.']},
 {id:'m61',n:'Суп-пюре из брокколи',m:'m',t:30,tags:['soup'],art:'bowl:soup_green,cream_swirl,croutons',i:[['broccoli',600],['potato',200],['onion',100],['cream',150],['oil',20]],sp:['соль','мускатный орех'],s:['Обжарьте лук на масле 3 минуты.','Добавьте картофель и брокколи, залейте 800 мл воды.','Варите 15 минут до мягкости.','Пробейте блендером до гладкости.','Влейте сливки, прогрейте, посолите.']},
 {id:'m62',n:'Минестроне',m:'m',t:40,tags:['soup','it','keeps'],art:'bowl:soup_red,pasta,beans,zucchini',i:[['pasta',80],['beans',1],['zucchini',200],['carrot',120],['celery',100],['canned_tomatoes',1],['potato',200],['oil',20],['greens',1]],sp:['соль','орегано'],s:['Обжарьте на масле морковь и сельдерей кубиками 5 минут.','Добавьте картофель, томаты и 1,5 л воды, варите 10 минут.','Добавьте кабачок и мелкие макароны, варите 8 минут.','Положите фасоль, прогрейте 2 минуты.','Посолите, добавьте орегано и зелень.']},
 {id:'m63',n:'Сливочный суп с сёмгой',m:'m',t:35,tags:['soup'],art:'bowl:soup_cream,salmon_bits,potato_cubes,greens',i:[['salmon',400],['potato',500],['cream',300],['onion',100],['carrot',100],['greens',1]],sp:['соль','перец'],s:['Залейте картофель, морковь и лук 1,5 л воды и варите 15 минут.','Нарежьте сёмгу кубиками по 2 см.','Влейте сливки и доведите до кипения.','Положите рыбу и варите 4–5 минут.','Посолите и посыпьте укропом.']},
 {id:'m64',n:'Окрошка на кефире',m:'m',t:30,tags:['soup','ru','quick'],art:'bowl:soup_white,egg_half,cucumber,potato_cubes,greens',i:[['kefir',1500],['potato',400],['eggs',4],['cucumber',300],['chicken_fillet',300],['greens',2]],sp:['соль','горчица по вкусу'],s:['Отварите картофель в мундире 20 минут, яйца — 9 минут, курицу — 20 минут.','Остудите и очистите.','Нарежьте всё мелким кубиком, огурцы тоже.','Мелко порубите зелень.','Залейте кефиром, разбавленным холодной водой 1:1, посолите.']},
 {id:'m65',n:'Солянка мясная (упрощённая)',m:'m',t:70,tags:['soup','ru'],art:'bowl:soup_red,beef,cucumber,lemon_slice',i:[['beef',400],['pickles',200],['tomato_paste',60],['onion',150],['potato',300],['lemon',1],['oil',20]],sp:['соль','лавровый лист'],s:['Сварите говяжий бульон в 2 л воды, 50 минут.','Достаньте мясо и нарежьте соломкой.','Обжарьте лук, добавьте томатную пасту и огурцы соломкой, тушите 5 минут.','Положите в бульон картофель, через 10 минут — зажарку и мясо.','Варите 5 минут, подавайте с долькой лимона.']},

 // ---- Расширение: второе ----
 {id:'m66',n:'Домашние котлеты с пюре',m:'m',t:50,tags:['kids','cutlets','ru','mince'],art:'plate:mash,cutlet,greens',i:[['minced_mix',600],['onion',100],['bread',0.25],['milk',250],['eggs',1],['potato',1000],['butter',30],['oil',30]],sp:['соль','перец'],s:['Замочите хлеб в 100 мл молока на 5 минут.','Смешайте фарш с натёртым луком, отжатым хлебом, яйцом, солью и перцем; отбейте фарш о миску 10 раз.','Поставьте вариться картофель — 20 минут.','Сформируйте котлеты мокрыми руками и обжарьте по 4 минуты с каждой стороны.','Добавьте 50 мл воды и томите под крышкой 10 минут.','Разомните картофель с горячим молоком и маслом.']},
 {id:'m67',n:'Курица в сметанном соусе с рисом',m:'m',t:45,tags:['kids','ru','stew'],art:'plate:rice,chicken,sourcream',i:[['chicken_thigh',800],['sour_cream',250],['onion',150],['garlic',3],['rice',300],['oil',20]],sp:['соль','перец','паприка'],s:['Поставьте вариться рис: 300 г на 600 мл воды, 15 минут.','Обжарьте курицу кусками до румяности, 8 минут.','Добавьте лук и жарьте 5 минут.','Смешайте сметану со 100 мл воды, чесноком и специями, залейте курицу.','Тушите под крышкой 20 минут.']},
 {id:'m68',n:'Минтай в кляре с пюре',m:'m',t:45,tags:['kids','whitefish','ru'],art:'plate:mash,cutlet_fish,lemon',i:[['fish_white',700],['eggs',2],['flour',80],['oil',60],['potato',1000],['butter',30],['milk',250]],sp:['соль','перец'],s:['Поставьте вариться картофель — 20 минут.','Нарежьте филе порционно, посолите.','Сделайте кляр: яйца, мука, 100 мл молока, щепотка соли.','Обмакните рыбу в кляр и жарьте на среднем огне по 3–4 минуты с каждой стороны.','Разомните картофель с горячим молоком и маслом.']},
 {id:'m69',n:'Рыба под маринадом с картофелем',m:'m',t:50,tags:['ru','whitefish','keeps'],art:'plate:potato,fish,carrot',i:[['fish_white',800],['carrot',300],['onion',200],['tomato_paste',60],['flour',40],['oil',50],['potato',800]],sp:['соль','сахар щепотка','лавровый лист','уксус 1 ст. л.'],s:['Поставьте вариться картофель — 20 минут.','Обваляйте рыбу в муке и обжарьте по 3 минуты с каждой стороны.','Обжарьте тёртую морковь и лук 10 минут.','Добавьте томатную пасту, 150 мл воды, сахар, уксус и лавровый лист, тушите 5 минут.','Залейте рыбу маринадом и прогрейте под крышкой 5 минут.']},
 {id:'m70',n:'Тефтели из индейки с булгуром',m:'m',t:40,tags:['kids','mince'],art:'plate:bulgur,meatball_small',i:[['minced_turkey',600],['bulgur',250],['onion',100],['eggs',1],['canned_tomatoes',1],['oil',20]],sp:['соль','перец'],s:['Обжарьте булгур 2 минуты, залейте 500 мл воды и варите 15 минут.','Смешайте фарш с яйцом, половиной лука, солью и перцем.','Скатайте тефтели размером с грецкий орех.','Обжарьте оставшийся лук, добавьте томаты и 100 мл воды.','Выложите тефтели в соус и тушите 20 минут.']},
 {id:'m71',n:'Гречка по-купечески',m:'m',t:50,tags:['ru','keeps'],art:'pan:buckwheat,beef,carrot',i:[['buckwheat',300],['pork',500],['onion',150],['carrot',150],['tomato_paste',40],['oil',30]],sp:['соль','перец','лавровый лист'],s:['Обжарьте свинину кусочками до корочки, 10 минут.','Добавьте лук и морковь, жарьте 5 минут.','Добавьте томатную пасту и промытую гречку, перемешайте.','Залейте 600 мл горячей воды, посолите.','Томите под крышкой на слабом огне 25 минут.']},
 {id:'m72',n:'Макароны с сыром и курицей',m:'m',t:25,tags:['kids','pasta','quick'],art:'plate:pasta_cream,chicken,cheese',i:[['pasta',400],['chicken_fillet',400],['cheese',150],['milk',200],['butter',20]],sp:['соль'],s:['Отварите макароны в подсоленной воде.','Обжарьте филе кусочками 7 минут.','В сотейнике растопите масло, влейте молоко и всыпьте тёртый сыр, мешайте до однородности.','Смешайте макароны, курицу и сырный соус.']},
 {id:'m73',n:'Жаркое по-домашнему',m:'m',t:80,tags:['ru','stew','keeps'],art:'bowl:stew,beef,potato_cubes,carrot,greens',i:[['beef',600],['potato',1000],['onion',150],['carrot',150],['garlic',2],['oil',30],['greens',1]],sp:['соль','перец','лавровый лист'],s:['Обжарьте говядину кусками до корочки.','Добавьте лук и морковь, жарьте 5 минут.','Влейте 300 мл воды и тушите 40 минут.','Добавьте картофель крупными кубиками и воду почти до верха.','Тушите 25 минут, в конце — чеснок и зелень.']},
 {id:'m74',n:'Курица по-французски',m:'m',t:55,tags:['baked','kids','casserole'],art:'tray:potato,cheese,tomato',i:[['chicken_fillet',600],['potato',800],['onion',150],['cheese',150],['sour_cream',150],['tomato',200]],sp:['соль','перец'],s:['Разогрейте духовку до 190 °C.','Нарежьте картофель тонкими кружками и выложите в форму, посолите.','Сверху — лук кольцами и слегка отбитое филе.','Смажьте сметаной, выложите помидоры и посыпьте сыром.','Запекайте 40 минут до золотистой корочки.']},
 {id:'m75',n:'Куриные бёдра с тыквой в духовке',m:'m',t:50,tags:['baked'],art:'tray:pumpkin,roast',i:[['chicken_thigh',1000],['pumpkin',600],['onion',100],['honey',20],['oil',20]],sp:['соль','перец','паприка'],s:['Разогрейте духовку до 200 °C.','Натрите бёдра солью, паприкой и мёдом.','Нарежьте тыкву кубиками, лук дольками, смешайте с маслом.','Выложите всё в форму.','Запекайте 40 минут.']},
 {id:'m76',n:'Свинина с яблоками и гречкой',m:'m',t:60,tags:['baked','ru'],art:'tray:roast,apple_slices',i:[['pork',800],['apple',3],['onion',150],['honey',20],['buckwheat',300]],sp:['соль','перец','тимьян'],s:['Разогрейте духовку до 190 °C.','Нарежьте свинину порционно, натрите солью, перцем и мёдом.','Выложите в форму на подушку из лука и яблочных долек.','Запекайте 45 минут, накрыв фольгой первые 25.','Отварите гречку на гарнир.']},
 {id:'m77',n:'Шницель из индейки с овощами',m:'m',t:30,tags:['quick'],art:'plate:chop,cucumber,tomato',i:[['turkey',600],['eggs',2],['flour',50],['oil',50],['cucumber',300],['tomato',300]],sp:['соль','перец'],s:['Нарежьте филе пластами и отбейте до 0,5 см.','Посолите, обваляйте в муке, затем в яйце.','Жарьте на разогретом масле по 3 минуты с каждой стороны.','Подавайте с нарезанными овощами.']},
 {id:'m78',n:'Тушёная говядина с овощами и рисом',m:'m',t:80,tags:['stew','keeps'],art:'plate:rice,beef_sauce',i:[['beef',600],['carrot',150],['onion',150],['bell_pepper',200],['tomato_paste',40],['rice',300],['oil',30]],sp:['соль','перец','паприка'],s:['Обжарьте говядину кубиками до корочки.','Добавьте лук, морковь и перец, жарьте 5 минут.','Добавьте томатную пасту и 500 мл воды.','Тушите под крышкой 60 минут.','Отварите рис на гарнир.']},
 {id:'m79',n:'Кабачковые оладьи со сметаной',m:'m',t:35,tags:['kids','pancake'],art:'plate:draniki,sourcream,greens',i:[['zucchini',800],['eggs',2],['flour',100],['garlic',2],['oil',50],['sour_cream',150],['greens',1]],sp:['соль','перец'],s:['Натрите кабачки на крупной тёрке, посолите и оставьте на 10 минут.','Хорошо отожмите сок.','Добавьте яйца, муку, чеснок и зелень.','Жарьте ложкой на масле по 3 минуты с каждой стороны.','Подавайте со сметаной.']},

/* Dish illustrations: top-down flat drawings composed from the recipe's art spec "vessel:part,part,...".
   Deterministic per recipe id, cached. Fixed palette (it is an image, not UI chrome). */
(function(){
const cache={};
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f1=n=>Math.round(n*10)/10;

// shape primitives: (g, x, y, s, c[]) -> svg
const SH={
 chunk(g,x,y,s,c){let p='';const n=7;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+g()*.4,r=s*(.7+g()*.35);p+=(i?'L':'M')+f1(x+Math.cos(a)*r)+' '+f1(y+Math.sin(a)*r)}
   return `<path d="${p}Z" fill="${c[0]}"/><circle cx="${f1(x-s*.2)}" cy="${f1(y-s*.25)}" r="${f1(s*.35)}" fill="${c[1]||c[0]}" opacity=".7"/>`},
 circle(g,x,y,s,c){return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(s)}" fill="${c[0]}"/><circle cx="${f1(x-s*.3)}" cy="${f1(y-s*.3)}" r="${f1(s*.35)}" fill="${c[1]||c[0]}" opacity=".8"/>`},
 oval(g,x,y,s,c){const a=g()*180;return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(s)}" ry="${f1(s*.62)}" fill="${c[0]}" transform="rotate(${f1(a)} ${f1(x)} ${f1(y)})"/><ellipse cx="${f1(x-s*.25)}" cy="${f1(y-s*.15)}" rx="${f1(s*.4)}" ry="${f1(s*.2)}" fill="${c[1]||c[0]}" opacity=".7" transform="rotate(${f1(a)} ${f1(x)} ${f1(y)})"/>`},
 slice(g,x,y,s,c){let o=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(s)}" fill="${c[0]}"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(s*.8)}" fill="${c[1]}"/>`;if(c[2])for(let i=0;i<5;i++){const a=i/5*Math.PI*2;o+=`<ellipse cx="${f1(x+Math.cos(a)*s*.4)}" cy="${f1(y+Math.sin(a)*s*.4)}" rx="${f1(s*.12)}" ry="${f1(s*.07)}" fill="${c[2]}" transform="rotate(${f1(a*57.3)} ${f1(x+Math.cos(a)*s*.4)} ${f1(y+Math.sin(a)*s*.4)})"/>`}return o},
 wedge(g,x,y,s,c){const a=g()*Math.PI*2,b=a+1.3;const P=(t,r)=>f1(x+Math.cos(t)*r)+' '+f1(y+Math.sin(t)*r);
   return `<path d="M${P(a,0)}L${P(a,s)}A${f1(s)} ${f1(s)} 0 0 1 ${P(b,s)}Z" fill="${c[0]}"/><path d="M${P(a+.15,s*.2)}L${P(a+.15,s*.8)}A${f1(s*.8)} ${f1(s*.8)} 0 0 1 ${P(b-.15,s*.8)}Z" fill="${c[1]||c[0]}"/>`},
 stick(g,x,y,s,c){const a=g()*180;return `<rect x="${f1(x-s)}" y="${f1(y-s*.18)}" width="${f1(s*2)}" height="${f1(s*.36)}" rx="${f1(s*.18)}" fill="${c[0]}" transform="rotate(${f1(a)} ${f1(x)} ${f1(y)})"/>`},
 leaf(g,x,y,s,c){const a=g()*180;return `<g transform="rotate(${f1(a)} ${f1(x)} ${f1(y)})"><ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(s)}" ry="${f1(s*.42)}" fill="${c[0]}"/><path d="M${f1(x-s*.9)} ${f1(y)}H${f1(x+s*.9)}" stroke="${c[1]||'#3d6b2c'}" stroke-width="${f1(s*.08)}"/></g>`},

  if(u==='ml'){ if(q>=1000) return dec(q/1000)+' л'; return (q<50?Math.round(q/5)*5:Math.round(q/10)*10)+' мл'}
  let v= buy? Math.ceil(q-0.001) : Math.round(q*2)/2; if(v===0) v=0.5;
  const t=v===0.5?'½':(v%1?(Math.floor(v)+'½'):String(v));
  const F={'пучок':['пучок','пучка','пучков'],'банка':['банка','банки','банок']}[u];
  return t+' '+(F&&v%1===0?plural(v,...F):(F&&v<1?F[1]:u));
}
const unitLabel=k=>{const u=ING[k][2];return u==='g'?'г':u==='ml'?'мл':u};

/* ============ RULES ============ */
function dietOk(r,d){
  const f=r.flags;
  if(d==='halal') return !f.includes('pork');
  if(d==='pesc') return !f.includes('meat');
  if(d==='veg') return !f.some(x=>['meat','fish','seafood'].includes(x));
  if(d==='vegan') return !f.some(x=>['meat','fish','seafood','dairy','egg','honey'].includes(x));
  if(d==='lent') return !f.some(x=>['meat','dairy','egg'].includes(x));
  return true;
}
function allowed(r){
  const p=S.profile;
  if(r.allerg.some(a=>p.allergies.includes(a))) return false;
  if(!dietOk(r,p.diet)) return false;
  if(r.i.some(([k])=>p.dislikes.includes(k))) return false;
  if(S.history.blocked.includes(r.id)) return false;
  return true;
}
function likeHits(r){return S.profile.likes.filter(t=>t.startsWith('i:')?r.i.some(([k])=>k===t.slice(2)):r.tags.includes(t.slice(2)))}
function goalScore(r){
  const g=S.profile.goals, k=r.m==='b'?.7:1; let s=0;
  if(g.includes('protein')) s+= r.P>=30*k?3:(r.P<15*k?-2:0);
  if(g.includes('lowcarb')) s+= r.C<=25*k?3:(r.C>60*k?-3:0);
  if(g.includes('lose')) s+= r.kcal<=450*k?3:(r.kcal>650*k?-3:0);
  if(g.includes('mass')) s+= (r.kcal>=600*k?2:(r.kcal<400*k?-2:0))+(r.P>=30*k?1:0);
  if(g.includes('pp')) s+= (r.kcal>=300*k&&r.kcal<=650*k&&r.F<=25*k?1:0)+(r.veg>=100?1:0)-(r.F>35?1:0);
  return s;
}
function mealsPerDay(){const m=S.profile.meals;return (m.b?1:0)+(m.l?(S.profile.soupBatch?.5:1):0)+(m.d?1:0)+(m.s?.3:0)+(m.z?.3:0)+(m.k?.2:0)}
function score(r,ctx){
  const p=S.profile; let s=0;
  s+=likeHits(r).length*2;
  const pk=new Set(S.pantry.map(x=>x.key));
  s+=r.i.filter(([k])=>pk.has(k)).length*1.2;
  if(S.history.liked.includes(r.id)) s+=1.5;
  if(S.history.disliked.includes(r.id)) s-=3;
  s+=goalScore(r);
  const target=p.budget/(7*Math.max(1,mealsPerDay())*portions());
  const rcost=rc(r)*(r.m==='b'||r.m==='m'?1:3); if(rcost>target) s-=Math.min(4,(rcost-target)/target*3);
  if(ctx&&ctx.prevProtein&&r.protein===ctx.prevProtein) s-=2;
  if(ctx&&ctx.reason==='time') s-=r.t/20;
  if(ctx&&ctx.reason==='cost') s-=rc(r)/60;
  if(ctx&&ctx.slot==='d'&&r.protein&&!r.tags.includes('salad')) s+=1.5;
  if(ctx&&ctx.reason==='pantry') s+=r.i.filter(([k])=>pk.has(k)).length*2;
  if(ctx&&ctx.reason==='light') s-=r.kcal/120;
  return s;
}
const isSoup=r=>r.tags.includes('soup');
function poolFor(slot){
  if(slot==='l'){const c=R.filter(r=>r.m==='m'&&isSoup(r)&&allowed(r)); return c.length?c:R.filter(r=>r.m==='m'&&allowed(r))}
  if(slot==='d'){const c=R.filter(r=>r.m==='m'&&!isSoup(r)&&allowed(r)); return c.length?c:R.filter(r=>r.m==='m'&&allowed(r))}
  return R.filter(r=>r.m===slot&&allowed(r));
}
function pick(slot,used,weekend,ctx){
  const p=S.profile; ctx=Object.assign({slot},ctx||{});
  let c=poolFor(slot); if(!c.length) return null;
  const maxT=p.maxTime?(weekend?p.maxTime+30:p.maxTime):999;
  const ct=c.filter(r=>r.t<=maxT); if(ct.length) c=ct;
  const cnt=id=>(used.cnt&&used.cnt[id])||0; const minU=Math.min(...c.map(r=>cnt(r.id)));
  const pool=c.filter(r=>cnt(r.id)===minU);
  const ranked=pool.map(r=>({r,s:score(r,ctx)+Math.random()*1.6})).sort((a,b)=>b.s-a.s);
  const top=ranked.slice(0,3); const ch=top[Math.floor(Math.random()*top.length)].r;
  used.cnt=used.cnt||{}; used.cnt[ch.id]=cnt(ch.id)+1; return ch;
}
function generate(){
  const p=S.profile,start=day0(NOW()),used={},por=portions(); let prev=null; const days=[];
  for(let d=0;d<7;d++){
    const date=addDays(start,d),wd=date.getDay(),weekend=wd===0||wd===6,slots={};
    if(p.meals.b){const r=pick('b',used,weekend);slots.b={rid:r&&r.id,serv:por}}
    if(p.meals.l){
      if(p.soupBatch&&d%2===1) slots.l={left:true,from:d-1,of:'l'};
      else {const r=pick('l',used,weekend);slots.l={rid:r&&r.id,serv:(p.soupBatch&&d<6)?por*2:por}}
    }
    if(p.meals.s){const r=pick('s',used,weekend);slots.s={rid:r&&r.id,serv:por}}
    if(p.meals.d){const r=pick('d',used,weekend,{prevProtein:prev});slots.d={rid:r&&r.id,serv:por}; if(r)prev=r.protein}
    if(p.meals.z){const r=pick('z',used,weekend);slots.z={rid:r&&r.id,serv:por}}
    if(p.meals.k){const r=pick('k',used,weekend);slots.k={rid:r&&r.id,serv:por}}
    days.push({date:date.toISOString(),slots});
  }
  S.plan={created:NOW().toISOString(),status:'draft',days}; S.bought={}; S.eaten={}; S.extra={}; fixLeftovers();
}
function slotRecipe(day,key){const s=S.plan.days[day].slots[key]; if(!s) return null; if(s.left){const src=S.plan.days[s.from].slots[s.of||'l']; return src&&src.rid?RBY[src.rid]:null} return s.rid?RBY[s.rid]:null}
const srcRef=(di,k)=>{const s=S.plan.days[di].slots[k];return s&&s.left?`${s.from}:${s.of||'l'}`:`${di}:${k}`};
const srcSlot=(di,k)=>{const s=S.plan.days[di].slots[k];return s.left?S.plan.days[s.from].slots[s.of||'l']:s};
function needMap(plan){
  const m={},spices=new Set();
  plan.days.forEach(d=>Object.values(d.slots).forEach(s=>{
    if(!s||s.left||!s.rid||!s.serv) return; const r=RBY[s.rid],f=s.serv/4;
    r.i.forEach(([k,q])=>{if(!m[k]) m[k]={qty:0,dishes:new Set()}; m[k].qty+=q*f; m[k].dishes.add(r.n)});
    (r.sp||[]).forEach(x=>spices.add(x));
  }));
  return {m,spices};
}
const pantryQty=k=>S.pantry.filter(x=>x.key===k).reduce((s,x)=>s+(+x.qty||0),0);
const fromList=k=>S.pantry.some(x=>x.key===k&&x.src==='list');
function shopping(){
  if(!S.plan) return {items:[],spices:[],cost:0};
  const {m,spices}=needMap(S.plan),items=[];
  Object.entries(m).forEach(([k,v])=>{
    const pq=pantryQty(k),toBuy=Math.max(0,v.qty-pq),u=ING[k][2],buyQ=(u==='g'||u==='ml')?toBuy:Math.ceil(toBuy-0.001);
    items.push({k,name:ING[k][0],cat:ING[k][1],need:v.qty,pq,toBuy:buyQ,dishes:[...v.dishes],covered:toBuy<=0.0001,bought:!!S.bought[k],cost:buyQ*price(k)});
  });
  items.sort((a,b)=>CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat)||a.name.localeCompare(b.name,'ru'));
  return {items,spices:[...spices].sort((a,b)=>a.localeCompare(b,'ru')),cost:items.filter(i=>!i.covered).reduce((s,i)=>s+i.cost,0)};
}
function markHave(k,qtyNeeded){
  const add=Math.max(0,qtyNeeded-pantryQty(k)); const u=ING[k][2];
  const q=(u==='g'||u==='ml')?Math.round(add):Math.ceil(add-0.001);
  if(q>0) S.pantry.push({key:k,qty:q,src:'list'});
}
const unmarkHave=k=>{S.pantry=S.pantry.filter(x=>!(x.key===k&&x.src==='list'))};
function todayIdx(){if(!S.plan) return -1; const t=day0(NOW()).getTime(); return S.plan.days.findIndex(d=>day0(d.date).getTime()===t)}
function dateLabel(iso,long){const d=new Date(iso); return long?`${DOWL[d.getDay()][0].toUpperCase()+DOWL[d.getDay()].slice(1)}, ${d.getDate()} ${MON[d.getMonth()]}`:`${DOW[d.getDay()]}, ${d.getDate()} ${MONS[d.getMonth()]}`}
const SLOT_END={b:11,l:15.5,s:17.5,d:21.5,z:23,k:24};
function nextSlotKey(day){const sl=S.plan.days[day].slots,h=NOW().getHours()+NOW().getMinutes()/60;
  const keys=SLOTS.filter(k=>sl[k]&&k!=='k');
  const k=keys.find(k=>SLOT_END[k]>h&&!S.eaten[eatKey(day,k)]); return k||keys.find(k=>!S.eaten[eatKey(day,k)])||keys[keys.length-1]||mainSlotKey(day)}
function mainSlotKey(day){const s=S.plan.days[day].slots; return s.d?'d':(s.l?'l':(s.b?'b':Object.keys(s)[0]))}
function dayKcal(di){return Object.keys(S.plan.days[di].slots).reduce((s,k)=>{const r=slotRecipe(di,k);return s+(r?r.kcal:0)},0)}
const eatKey=(di,k)=>S.plan.days[di].date.slice(0,10)+':'+k;
function eatenKcal(di){return Object.keys(S.plan.days[di].slots).reduce((s,k)=>{const r=slotRecipe(di,k);return s+(r&&S.eaten[eatKey(di,k)]?r.kcal:0)},0)}

function altList(day,slot,reason){
  const cur=slotRecipe(day,slot),inWeek=new Set(); S.plan.days.forEach(d=>Object.values(d.slots).forEach(s=>s&&s.rid&&inWeek.add(s.rid)));
  const wd=new Date(S.plan.days[day].date).getDay(),weekend=wd===0||wd===6,maxT=S.profile.maxTime?(weekend?S.profile.maxTime+30:S.profile.maxTime):999;
  const rank=arr=>arr.map(r=>({r,s:score(r,{reason,slot})})).sort((a,b)=>b.s-a.s).map(x=>x.r);
  const base=poolFor(slot).filter(r=>r.id!==cur.id);
  const wider=(slot==='l'||slot==='d'?R.filter(r=>r.m==='m'&&allowed(r)):slot==='b'?R.filter(r=>(r.m==='b'||r.m==='s')&&allowed(r)):R.filter(r=>['s','z','k'].includes(r.m)&&allowed(r))).filter(r=>r.id!==cur.id);

  const out=[],seen=new Set(); for(const t of tiers){for(const r of rank(t)){if(out.length>=5) break; if(!seen.has(r.id)){seen.add(r.id);out.push(r)}} if(out.length>=5) break}

function shellAct(a,v,el){
  const p=S.profile; if(v4Act(a,v,el)) return true;
  switch(a){
   case 'introNext': if((S.introIdx||0)<SLIDES.length-1) S.introIdx=(S.introIdx||0)+1; else S.stage=S.user?(S.plan?'app':'quiz'):'auth'; return true;
   case 'introSkip': S.stage=S.user?(S.plan?'app':'quiz'):'auth'; return true;
   case 'authBack': UI.authStep='phone'; UI.code=''; UI.codeErr=''; return true;
   case 'guest': {S.user=null; act('demo'); return false}
   case 'qNext': S.qStep=Math.min(QUIZ.length-1,(S.qStep||0)+1); return true;
   case 'qBack': S.qStep=Math.max(0,(S.qStep||0)-1); return true;
   case 'qSkip': if((S.qStep||0)<QUIZ.length-1){S.qStep++; return true} build(); return false;
   case 'qcnt': {const [k,d]=v.split(':'); setCounts(k,+d); return true}
   case 'noAllergy': p.allergies=[]; return true;

/* ---------- state & time ---------- */
function V(){if(!S.v4) S.v4={trialStart:null,sub:null,shift:0,ul:{},seen:{},ev:[],weeks:0}; return S.v4}
const dayN=()=>{const t=V().trialStart; if(!t) return 0; return Math.round((day0(NOW())-day0(new Date(t)))/864e5)};

  if(!S.plan||!V().trialStart) return false;

act=(function(orig){return function(a,v,el){

    const E={approve:'menu_approved',recipe:'recipe_opened',cook:'cook_started',doReplace:'dish_replaced',copy:'list_copied',share:'share_opened',cartStart:'cart_started',famOpen:'family_view_opened'};

   case 'cartPrev': UI.cart.i=Math.max(0,UI.cart.i-1); return true;
   case 'cartClose': UI.cart=null; return true;
   case 'metricsCopy': {const t=JSON.stringify(V4.ev,null,1); if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('События скопированы'),()=>toast('Не удалось скопировать')); return false}
  }
  return false;
}
