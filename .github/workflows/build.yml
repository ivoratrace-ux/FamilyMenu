name: Build Web
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'tests/web/**'
      - 'backend/data/**'
      - 'scripts/build-web.mjs'
      - 'scripts/serve-web.mjs'
      - 'scripts/web-smoke.mjs'
      - '.github/workflows/build.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'tests/web/**'
      - 'backend/data/**'
      - 'scripts/build-web.mjs'
      - 'scripts/serve-web.mjs'
      - 'scripts/web-smoke.mjs'
      - '.github/workflows/build.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Static Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/web/*.test.mjs
      - run: node scripts/build-web.mjs
      - name: Browser smoke test (mocked backend)
        run: node scripts/web-smoke.mjs _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-reports
          path: build/reports/web-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: family-menu-web
          path: _site/
          if-no-files-found: error
  publish-web:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [web]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
