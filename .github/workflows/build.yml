name: Build multiplatform apps
on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'backend/data/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'kotlin-js-store/**'
      - 'scripts/web-smoke.mjs'
      - '.github/workflows/build.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'composeApp/**'
      - 'backend/data/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'kotlin-js-store/**'
      - 'scripts/web-smoke.mjs'
      - '.github/workflows/build.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android APK and shared tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:desktopTest :composeApp:assembleDebug :composeApp:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: family-menu-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            composeApp/build/reports/tests/
            composeApp/build/reports/lint-results-debug.html
  web:
    name: Compose Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser smoke test (mocked scanner API)
        run: node scripts/web-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-reports
          path: composeApp/build/reports/web-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: family-menu-web
          path: composeApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
  ios:
    name: iOS simulator app (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - run: xcodebuild -version
      - run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build simulator app without Apple signing
        run: >-
          xcodebuild -project iosApp/FamilyMenu.xcodeproj -scheme FamilyMenu
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath iosApp/build
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO build
      - name: Archive simulator app with executable permissions
        run: tar -czf iosApp/build/FamilyMenu-simulator.tar.gz -C iosApp/build/Build/Products/Debug-iphonesimulator FamilyMenu.app
      - uses: actions/upload-artifact@v4
        with:
          name: family-menu-ios-simulator
          path: iosApp/build/FamilyMenu-simulator.tar.gz
          if-no-files-found: error
  publish-web:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, web, ios]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
